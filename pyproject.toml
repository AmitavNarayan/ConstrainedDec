[project]
name = "constraineddec"
version = "0.1.0"
requires-python = ">=3.12, <3.13"
dependencies = [
    "accelerate>=1.16.0",
    "datasets>=5.2.0",
    "outlines>=1.3.3",
    "transformers>=5.16.1, <5.23.0",
    "vllm>=0.12",
    "wandb>=0.31.2",
    "vllm-metal ; sys_platform == 'darwin'",
    "dataclasses>=0.8",
]
[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
override-dependencies = ["nvidia-cutlass-dsl; sys_platform != 'darwin'"]
[tool.uv.sources]
vllm = {url = "https://github.com/vllm-project/vllm/releases/download/v0.34.0/vllm-0.34.0%2Bcpu-cp38-abi3-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin'"}
vllm-metal = {url = "https://github.com/vllm-project/vllm-metal/releases/download/v0.34.0/vllm_metal-0.34.0-cp312-cp312-macosx_15_0_arm64.whl"}
